<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Journey browser check</title></head>
  <body><div id="root"></div><script>
    window.addEventListener("error", event => {
      document.body.textContent = `BROWSER ERROR · ${event.message}`;
    });
    window.addEventListener("unhandledrejection", event => {
      document.body.textContent = `BROWSER REJECTION · ${String(event.reason)}`;
    });
  </script><script type="module" src="/scripts/journey-browser-check.tsx"></script></body>
</html>
